<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rdbackend console</title>
<style>
  :root { --bg:#f6f7f9; --fg:#1d2329; --muted:#6b7480; --card:#fff; --line:#e2e5e9; --accent:#0071ff; --ok:#1a9e55; --bad:#c9372c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16191d; --fg:#e6e8eb; --muted:#9aa3ad; --card:#1f2328; --line:#30363d; --accent:#4c9aff; --ok:#3fbf7f; --bad:#f06a5f; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--fg); }
  header { display:flex; align-items:center; gap:16px; padding:12px 20px; background:var(--card); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; }
  nav { display:flex; gap:4px; flex-wrap:wrap; }
  nav button { background:none; border:0; padding:6px 10px; border-radius:6px; color:var(--muted); cursor:pointer; font:inherit; }
  nav button.active { background:var(--bg); color:var(--fg); font-weight:600; }
  .spacer { flex:1; }
  main { padding:20px; max-width:1200px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; overflow-x:auto; }
  table { border-collapse:collapse; width:100%; }
  th, td { text-align:left; padding:6px 10px; border-bottom:1px solid var(--line); vertical-align:top; white-space:nowrap; }
  td.wrap { white-space:normal; word-break:break-word; max-width:360px; }
  th { color:var(--muted); font-weight:500; font-size:12px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; background:var(--muted); }
  .dot.on { background:var(--ok); }
  input, select { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
  button.btn { font:inherit; padding:6px 12px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.danger { color:var(--bad); }
  form.inline { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  #login { max-width:320px; margin:80px auto; display:flex; flex-direction:column; gap:10px; }
  .err { color:var(--bad); min-height:1.4em; }
  .muted { color:var(--muted); }
  .pager { display:flex; gap:8px; align-items:center; margin-top:12px; }
</style>
</head>
<body>
<div id="login-view" hidden>
  <form id="login" class="card">
    <h1 style="font-size:18px;margin:0 0 4px">rdbackend console</h1>
    <input id="lu" placeholder="Username" autocomplete="username" required>
    <input id="lp" type="password" placeholder="Password" autocomplete="current-password" required>
    <button class="btn primary" type="submit">Log in</button>
    <div class="err" id="lerr"></div>
  </form>
</div>
<div id="app-view" hidden>
  <header>
    <h1>rdbackend</h1>
    <nav id="tabs">
      <button data-tab="devices">Devices</button>
      <button data-tab="conn">Connections</button>
      <button data-tab="file">File transfers</button>
      <button data-tab="alarm">Alarms</button>
      <button data-tab="users">Users</button>
    </nav>
    <div class="spacer"></div>
    <span class="muted" id="me"></span>
    <button class="btn" id="logout">Log out</button>
  </header>
  <main>
    <div class="err" id="err"></div>
    <div class="card" id="content"></div>
  </main>
</div>
<script>
"use strict";
const PAGE = 50;
let token = sessionStorage.getItem("rd_token") || "";
let tab = "devices", page = 1, timer = null;

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== null && v !== false) e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) e.append(k instanceof Node ? k : document.createTextNode(k == null ? "" : String(k)));
  return e;
}
function fmtTime(t) { return t ? new Date(t * 1000).toLocaleString() : ""; }
function fmtDur(a, b) {
  if (!a || !b) return "";
  let s = b - a; const h = Math.floor(s / 3600); s %= 3600; const m = Math.floor(s / 60); s %= 60;
  return (h ? h + "h " : "") + (h || m ? m + "m " : "") + s + "s";
}
const CONN_TYPE = { 0: "Remote desktop", 1: "File transfer", 2: "Port forward", 3: "View camera", 4: "Terminal" };
const AUTH = { 1: "Click to accept", 2: "Temporary password", 3: "Permanent password", 4: "Switch sides" };
const TFA = { 1: "TOTP", 2: "Trusted device" };
const FILE_TYPE = { 0: "Sent from device", 1: "Received by device" };
const ALARM = { 0: "IP whitelist", 1: "More than 30 attempts", 2: "6 attempts within a minute", 6: "IPv6 prefix attempts",
  7: "Terminal OS login backoff", 8: "Terminal OS login concurrency", 9: "Session scope violation", 10: "ID whitelist" };

async function api(method, path, body) {
  const r = await fetch(path, {
    method, headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const text = await r.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch (_) {}
  if (r.status === 401) { setToken(""); throw new Error("Session expired, please log in again"); }
  if (!r.ok || (data && data.error)) throw new Error((data && data.error) || ("HTTP " + r.status));
  return data;
}
function setToken(t) {
  token = t;
  try { t ? sessionStorage.setItem("rd_token", t) : sessionStorage.removeItem("rd_token"); } catch (_) {}
  show();
}
function show() {
  document.getElementById("login-view").hidden = !!token;
  document.getElementById("app-view").hidden = !token;
  if (token) { document.getElementById("me").textContent = sessionStorage.getItem("rd_user") || ""; render(); }
  else clearInterval(timer);
}
function setErr(e) { document.getElementById("err").textContent = e ? String(e.message || e) : ""; }

function table(headers, rows) {
  return el("table", {}, el("thead", {}, el("tr", {}, headers.map(h => el("th", {}, h)))),
    el("tbody", {}, rows.length ? rows : [el("tr", {}, el("td", { colspan: headers.length, class: "muted" }, "Nothing yet"))]));
}
function pager(total) {
  const pages = Math.max(1, Math.ceil(total / PAGE));
  return el("div", { class: "pager" },
    el("button", { class: "btn", disabled: page <= 1, onclick: () => { page--; render(); } }, "Previous"),
    el("span", { class: "muted" }, `Page ${page} of ${pages} (${total} total)`),
    el("button", { class: "btn", disabled: page >= pages, onclick: () => { page++; render(); } }, "Next"));
}

async function renderDevices(c) {
  const d = await api("GET", `/api/admin/devices?current=${page}&pageSize=${PAGE}`);
  const rows = d.data.map(p => el("tr", {},
    el("td", {}, el("span", { class: "dot" + (p.online ? " on" : "") }), p.online ? "Online" : "Offline"),
    el("td", {}, p.id), el("td", {}, p.info.device_name), el("td", {}, p.info.username),
    el("td", { class: "wrap" }, p.info.os), el("td", {}, p.version), el("td", {}, p.user_name),
    el("td", {}, p.online && p.conns ? p.conns : ""), el("td", {}, fmtTime(p.last_online)),
    el("td", {}, el("button", { class: "btn danger", onclick: async () => {
      if (!confirm(`Remove device ${p.id} from the registry?`)) return;
      try { await api("DELETE", "/api/admin/devices/" + encodeURIComponent(p.id)); render(); } catch (e) { setErr(e); }
    } }, "Remove"))));
  c.append(table(["Status", "ID", "Hostname", "OS user", "OS", "Version", "Account", "Sessions", "Last seen", ""], rows), pager(d.total));
}

async function renderAudit(c, kind) {
  const d = await api("GET", `/api/admin/audit/${kind}?current=${page}&pageSize=${PAGE}`);
  const dev = a => a.hostname ? `${a.device_id} (${a.hostname})` : a.device_id;
  let headers, rows;
  if (kind === "conn") {
    headers = ["Started", "Device", "From ID", "From name", "IP", "Type", "Auth", "Duration", "Note"];
    rows = d.data.map(a => el("tr", {}, el("td", {}, fmtTime(a.started_at)), el("td", {}, dev(a)),
      el("td", {}, a.peer_id), el("td", {}, a.peer_name), el("td", {}, a.ip),
      el("td", {}, a.conn_type == null ? (a.ended_at ? "Not authorized" : "") : (CONN_TYPE[a.conn_type] || a.conn_type)),
      el("td", {}, [AUTH[a.primary_auth], TFA[a.two_factor]].filter(Boolean).join(" + ")),
      el("td", {}, a.ended_at ? fmtDur(a.started_at, a.ended_at) : "active"), el("td", { class: "wrap" }, a.note)));
  } else if (kind === "file") {
    headers = ["Time", "Device", "Peer ID", "Direction", "Path", "Details"];
    rows = d.data.map(a => {
      let info = a.info; try { const i = JSON.parse(a.info); info = `${i.num} item(s): ` + (i.files || []).map(f => f[0] || "(file)").join(", "); } catch (_) {}
      return el("tr", {}, el("td", {}, fmtTime(a.created_at)), el("td", {}, dev(a)), el("td", {}, a.peer_id),
        el("td", {}, FILE_TYPE[a.typ] || a.typ), el("td", { class: "wrap" }, a.path), el("td", { class: "wrap" }, info));
    });
  } else {
    headers = ["Time", "Device", "Alarm", "Details"];
    rows = d.data.map(a => el("tr", {}, el("td", {}, fmtTime(a.created_at)), el("td", {}, dev(a)),
      el("td", {}, ALARM[a.typ] || a.typ), el("td", { class: "wrap" }, a.info)));
  }
  c.append(table(headers, rows), pager(d.total));
}

async function renderUsers(c) {
  const d = await api("GET", "/api/admin/users");
  const name = el("input", { placeholder: "User name", required: true });
  const pw = el("input", { type: "password", placeholder: "Password (min. 8)", minlength: 8, required: true, autocomplete: "new-password" });
  const adm = el("input", { type: "checkbox" });
  const form = el("form", { class: "inline", onsubmit: async ev => {
    ev.preventDefault();
    try { await api("POST", "/api/admin/users", { name: name.value, password: pw.value, is_admin: adm.checked }); render(); } catch (e) { setErr(e); }
  } }, name, pw, el("label", {}, adm, " admin"), el("button", { class: "btn primary", type: "submit" }, "Add user"));
  const upd = async (u, body) => { try { await api("PUT", "/api/admin/users/" + encodeURIComponent(u.name), body); render(); } catch (e) { setErr(e); } };
  const rows = d.data.map(u => el("tr", {},
    el("td", {}, u.name), el("td", {}, u.is_admin ? "Admin" : "User"), el("td", {}, u.status === 1 ? "Enabled" : "Disabled"),
    el("td", {},
      el("button", { class: "btn", onclick: () => { const p = prompt(`New password for ${u.name} (min. 8 characters):`); if (p) upd(u, { password: p }); } }, "Set password"), " ",
      el("button", { class: "btn", onclick: () => upd(u, { is_admin: !u.is_admin }) }, u.is_admin ? "Make user" : "Make admin"), " ",
      el("button", { class: "btn", onclick: () => upd(u, { status: u.status === 1 ? 0 : 1 }) }, u.status === 1 ? "Disable" : "Enable"), " ",
      el("button", { class: "btn danger", onclick: async () => {
        if (!confirm(`Delete user ${u.name} and their address book?`)) return;
        try { await api("DELETE", "/api/admin/users/" + encodeURIComponent(u.name)); render(); } catch (e) { setErr(e); }
      } }, "Delete"))));
  c.append(form, table(["Name", "Role", "Status", ""], rows));
}

async function render() {
  for (const b of document.querySelectorAll("#tabs button")) b.classList.toggle("active", b.dataset.tab === tab);
  const c = document.getElementById("content");
  const fresh = el("div");
  try {
    if (tab === "devices") await renderDevices(fresh);
    else if (tab === "users") await renderUsers(fresh);
    else await renderAudit(fresh, tab);
    setErr("");
    c.replaceChildren(fresh);
  } catch (e) { setErr(e); }
  clearInterval(timer);
  if (tab === "devices" || tab === "conn") timer = setInterval(render, 15000);
}

document.getElementById("tabs").addEventListener("click", ev => {
  const t = ev.target.closest("button"); if (!t) return;
  tab = t.dataset.tab; page = 1; render();
});
document.getElementById("login").addEventListener("submit", async ev => {
  ev.preventDefault();
  const lerr = document.getElementById("lerr"); lerr.textContent = "";
  try {
    const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: document.getElementById("lu").value, password: document.getElementById("lp").value, type: "account" }) });
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    if (!d.user || !d.user.is_admin) {
      await fetch("/api/logout", { method: "POST", headers: { "Authorization": "Bearer " + d.access_token } });
      throw new Error("This account is not an administrator");
    }
    try { sessionStorage.setItem("rd_user", d.user.name); } catch (_) {}
    document.getElementById("lp").value = "";
    setToken(d.access_token);
  } catch (e) { lerr.textContent = e.message; }
});
document.getElementById("logout").addEventListener("click", async () => {
  try { await fetch("/api/logout", { method: "POST", headers: { "Authorization": "Bearer " + token } }); } catch (_) {}
  setToken("");
});
show();
</script>
</body>
</html>
